[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Verwaltung unter /admin
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Kurzlinks für die QR-Codes je Werbekanal. Die Quelle landet in Plausible
# und bei der Anmeldung (Spalte „Quelle“ in /admin). Neuer Kanal = neuer Block
# hier + Eintrag in scripts/qr-codes.mjs.
[[redirects]]
  from = "/zeitung"
  to = "/?utm_source=zeitung"
  status = 302

[[redirects]]
  from = "/flyer"
  to = "/?utm_source=flyer"
  status = 302

[[redirects]]
  from = "/plakat"
  to = "/?utm_source=plakat"
  status = 302
