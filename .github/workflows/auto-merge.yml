# Änderungen automatisch prüfen, übernehmen und veröffentlichen.
#
# Ablauf: Jemand (z. B. Alex über Claude Code) pusht eine Änderung auf einen Arbeits-Branch
#   → diese Action führt sie mit dem Live-Branch zusammen
#   → prüft das Ergebnis (npm run check)
#   → nur wenn alles grün ist: Push auf den Live-Branch → Netlify veröffentlicht automatisch.
# Schlägt etwas fehl, bleibt die Seite unverändert und GitHub meldet den Fehler per E-Mail.
name: Änderungen automatisch übernehmen

on:
  push:
    branches:
      - '**'

env:
  LIVE_BRANCH: claude/relaxed-cannon-2kqiie

# immer nur eine Übernahme gleichzeitig, damit sich zwei Änderungen nicht in die Quere kommen
concurrency:
  group: live-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  uebernehmen:
    name: Prüfen und in den Live-Branch übernehmen
    if: github.ref_name != 'claude/relaxed-cannon-2kqiie'
    runs-on: ubuntu-latest
    steps:
      - name: Live-Branch holen
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LIVE_BRANCH }}
          fetch-depth: 0

      - name: Änderung zusammenführen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          if ! git merge --no-edit "origin/${GITHUB_REF_NAME}" -m "Automatisch übernommen: ${GITHUB_REF_NAME}"; then
            echo "::error::Die Änderung passt nicht automatisch zum aktuellen Stand (Konflikt). Bitte in Claude Code: 'Bring den Live-Branch ${LIVE_BRANCH} in meinen Branch und löse den Konflikt.'"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Sicherheitsprüfung
        run: npm run check

      - name: Veröffentlichen (Push auf den Live-Branch)
        run: git push origin "HEAD:${LIVE_BRANCH}"

  pruefen:
    name: Live-Branch prüfen
    if: github.ref_name == 'claude/relaxed-cannon-2kqiie'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sicherheitsprüfung
        run: npm run check
